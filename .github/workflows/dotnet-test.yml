name: .NET Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore GLMS.sln

    - name: Build
      run: dotnet build GLMS.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test GLMS.sln --no-build --configuration Release --verbosity normal